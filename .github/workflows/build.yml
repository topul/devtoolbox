name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # macOS: 跳过代码签名（无证书）
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # tag 构建时 electron-builder 直接上传产物到 Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      # 拦「只在运行时暴露」的崩溃：主进程产物是 ESM，被 externalizeDepsPlugin 外置的 CJS 依赖
      # 若用 Object.defineProperty(getter) 导出，具名导入会让应用启动即 SyntaxError（v1.1.0 的教训）。
      # 必须在打包之前跑，否则会先把崩溃包装进 Release。
      - name: Check main-process imports (smoke:main)
        run: npm run smoke:main

      # tag 构建：直接发布到 GitHub Release（生成 latest.yml 等自动升级元数据）
      # 手动触发：只打包不上传
      - name: Package & Publish (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DevOps-Toolbox-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.msi
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

  # electron-builder 以 draft 形式创建 Release（避免三平台并发发布半成品）
  # 等全部产物上传完成后，这里统一生成 Release Notes 并正式发布
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          BODY=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" --jq .body)
          gh release edit "$TAG" --draft=false --latest --notes "$BODY"
