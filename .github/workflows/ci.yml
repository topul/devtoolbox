name: CI

# PR / push 到 main 时的提交前检查。
#
# 为什么单独一个文件：发布流水线（build.yml）只在打 tag 时触发，等它红的时候
# 半成品已经要进 Release 了。这里把格式、类型、单测、i18n 对齐和全部「不依赖构建产物」
# 的 smoke 前移到每次提交 —— 问题在合并前就暴露，而不是在发布夜。
#
# 与 build.yml 的分工：
#   ci.yml     —— 每个 PR / 每次 push：静态检查 + 源码级冒烟 + 构建产物复检 + 扩展构建
#   build.yml  —— 只有 tag：三平台打包并发布 Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============ 快检：不碰构建产物，全部从源码静态分析 / esbuild 打包运行 ============
  check:
    name: Check (no build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 是 Active LTS；@electron/rebuild 等 >=22.12 的依赖也不再告警
          node-version: 22
          cache: npm

      - run: npm ci

      # 风格漂移会让所有 diff 变噪：格式不对直接红，最便宜的检查放最前
      - name: Format check (prettier)
        run: npm run format:check

      # 类型检查拆了两份 tsconfig，两侧都要跑：渲染层（src）+ 主进程/electron
      - name: Typecheck (renderer)
        run: npm run typecheck

      - name: Typecheck (main / electron)
        run: npm run typecheck:node

      # 死代码 / 未使用导入 / hooks 误用。warn（如 no-explicit-any）不阻断，只拦 error
      - name: Lint
        run: npm run lint

      # toolkit 纯函数的单测（Vitest）：与 MCP 服务端、渲染层三方共用的核心逻辑
      - name: Unit tests (toolkit)
        run: npm test

      # 中英文词条键结构一致，漏翻译 / 多键在这里红
      - name: i18n parity
        run: npm run i18n:check

      # 全部工具的双语 SSR 冒烟 + 导航结构自检（新增工具忘了实现会在这里红）
      - name: Smoke — render all tools
        run: npm run smoke:render

      # IPC 通道名是字符串，写错只在用户点那个功能时炸 —— 静态对齐两侧
      - name: Smoke — IPC channels
        run: npm run smoke:ipc

      # 剩余源码级冒烟统一走 runner：`npm run smoke` 即全量
      - name: Smoke — chat & agent
        run: npm run smoke chat chatagent chatstore chattrace skills compare chatui

      - name: Smoke — schema & HTTP kernels
        run: npm run smoke schema httpcodec httpenv httpsnap httpsave sse proxy

      - name: Smoke — agent rules / MCP / 其余内核
        run: npm run smoke agentrules mcpprobe tracestore mcpclient sqlcheck tls har graphql regexreplace systemproxy ux

      # 供应链卫生：生产依赖里有 critical 直接红（high 及以下由 Dependabot 跟进）。
      # node-forge 目前存在无修复的 high（本地证书解析场景，攻击面在可控范围），
      # 因此门禁设在 critical，同时把完整报告打出来供人看。
      - name: Audit (production deps)
        run: |
          npm audit --omit=dev --audit-level=critical
          npm audit --omit=dev || true

  # ============ 构建复检：与发布流水线同一套构建，跑依赖产物的冒烟 ============
  build:
    name: Build & verify artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 渲染层 + 主进程 + 预加载 + MCP 单文件产物，与 build.yml 发布前完全同一套
      - name: Build
        run: npm run build

      # 拦「只在运行时暴露」的崩溃：主进程产物被外置的 CJS 依赖若用 getter 导出，
      # 具名导入会让应用启动即 SyntaxError。与 build.yml 同一道关口。
      - name: Smoke — main-process imports
        run: npm run smoke:main

      # 渲染层不能依赖外部资源：生产构建注入了严格 CSP，外链字体会被静默挡掉
      - name: Smoke — built assets (no external resources)
        run: npm run smoke:assets

      # MCP 服务端端到端：起真实进程走 stdio JSON-RPC，逐个调用目录里声明的工具
      - name: Smoke — MCP server end-to-end
        run: npm run smoke:mcp

  # ============ 浏览器扩展构建：此前没有任何一道检查，manifest 改坏只有用户知道 ============
  extension:
    name: Extension build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 扩展版（无本机进程）构建 + 打包；desktopOnly 工具的可见性逻辑在这里被 exercises
      - name: Build extension
        run: npm run build:ext

      - name: Verify extension artifacts
        run: |
          test -d dist-extension
          test -f dist-extension/manifest.json
          node -e "const m=require('./dist-extension/manifest.json'); if(!m.version) throw new Error('manifest missing version'); console.log('manifest ok:', m.version)"
